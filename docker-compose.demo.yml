# FMMS Demo - backend + frontend, with optional SAP connectivity.
#
# Start:
#   docker compose -f docker-compose.demo.yml up --build
#
# Real SAP demo:
#   SAP_USE_MOCK=False SAP_USERNAME=... SAP_PASSWORD=... \
#   docker compose -f docker-compose.demo.yml up --build
#
# URLs:
#   Frontend  http://localhost:5500
#   Backend   http://localhost:8000/api/v1/

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: fmms-demo-backend:v2
    container_name: fmms_demo_backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      POSTGRES_HOST: ${POSTGRES_DOCKER_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-fmms}
      POSTGRES_USER: ${POSTGRES_USER:-fmms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fmms}
      CELERY_BROKER_URL: memory://
      SAP_USE_MOCK: ${SAP_USE_MOCK:-True}
      SAP_BASE_URL: ${SAP_BASE_URL:-http://ghsapsnd-app.gbgnetwork.net:8000/sap/opu/odata/sap}
      SAP_CLIENT: ${SAP_CLIENT:-100}
      SAP_USERNAME: ${SAP_USERNAME:-}
      SAP_PASSWORD: ${SAP_PASSWORD:-}
      SAP_ASHOST: ${SAP_ASHOST:-GHSAP-APP1.gbgnetwork.net}
      SAP_SYSNR: ${SAP_SYSNR:-01}
      SAP_LANG: ${SAP_LANG:-EN}
      SAP_TIMEOUT_SECONDS: ${SAP_TIMEOUT_SECONDS:-30}
      SAP_VERIFY_SSL: ${SAP_VERIFY_SSL:-False}
      SAP_VEHICLE_DRIVER_SERVICE: ${SAP_VEHICLE_DRIVER_SERVICE:-ZC_VEHICLEDRIVER_CDS}
      SAP_VEHICLE_DRIVER_ENTITY_SET: ${SAP_VEHICLE_DRIVER_ENTITY_SET:-ZC_VehicleDriver}
      SAP_OBJECT_PART_CATALOG_SERVICE: ${SAP_OBJECT_PART_CATALOG_SERVICE:-ZI_FLEET_CAT_B_CDS}
      SAP_OBJECT_PART_CATALOG_ENTITY_SET: ${SAP_OBJECT_PART_CATALOG_ENTITY_SET:-}
      SAP_FAULT_CATALOG_SERVICE: ${SAP_FAULT_CATALOG_SERVICE:-ZI_B_DEFECTCATALOG9_CDS}
      SAP_FAULT_CATALOG_ENTITY_SET: ${SAP_FAULT_CATALOG_ENTITY_SET:-}
      SAP_CENTRAL_STOCK_SERVICE: ${SAP_CENTRAL_STOCK_SERVICE:-ZI_STOCK_KH08_CDS}
      SAP_CENTRAL_STOCK_ENTITY_SET: ${SAP_CENTRAL_STOCK_ENTITY_SET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./mediafiles:/app/mediafiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
    image: fmms-demo-frontend:v2
    container_name: fmms_demo_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5500:5500"
    depends_on:
      - backend
    restart: unless-stopped
